[package]
name = "yumlog-npu-emulator"
version = "0.1.0"
description = "Native Yumlog NPU emulator container app"
authors = ["Darbot Labs"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "yumlog_npu_emulator"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
